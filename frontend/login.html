<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Messenger - Вход</title>

<link rel="stylesheet" href="/frontend/css/style.css">
</head>

<body>

<div class="login-box">

    <h1>Crystal Messenger</h1>

    <form id="loginForm">

        <input
            id="email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            required
        >

        <button type="submit">

            Войти

        </button>

    </form>

    <p>

        Нет аккаунта?

        <a href="register.html">

            Зарегистрироваться

        </a>

    </p>

</div>

<script src="/frontend/js/config.js"></script>
<script src="/frontend/js/login.js"></script>


</body>
</html>
